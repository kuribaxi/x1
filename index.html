// === NY & FÖRBÄTTRAD DEL ===
function setupIframeLinkInterceptor() {
    const iframe = document.getElementById('popup-iframe');
    
    iframe.onload = function() {
        clearTimeout(iframeTimeout);
        
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            // Fånga alla länkar
            iframeDoc.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function(e) {
                    let href = this.getAttribute('href');
                    if (!href) return;

                    if (href.startsWith('javascript:') || href.startsWith('#') || href.startsWith('mailto:')) return;

                    let fullUrl = href;
                    if (!href.startsWith('http')) {
                        try {
                            const base = new URL(iframe.src);
                            fullUrl = new URL(href, base).href;
                        } catch(e) {}
                    }

                    if (fullUrl.includes('karwan.tv')) {
                        e.preventDefault();
                        popLoad(fullUrl, 'Karwan TV');
                    } else {
                        e.preventDefault();
                        window.open(fullUrl, '_blank');
                    }
                });
            });
        } catch (err) {
            console.log('Iframe interceptor: Cross-origin (normalt)');
        }
        
        document.getElementById('popup-loading').style.display = 'none';
        iframe.style.display = 'block';
    };
}

function doLoadIframe(url) {
    const iframe = document.getElementById('popup-iframe');
    const loading = document.getElementById('popup-loading');
    const blocked = document.getElementById('popup-blocked');

    loading.style.display = 'flex';
    iframe.style.display = 'none';
    blocked.classList.remove('show');

    clearTimeout(iframeTimeout);

    iframeTimeout = setTimeout(() => {
        loading.style.display = 'none';
        blocked.classList.add('show');
    }, 8000);

    setupIframeLinkInterceptor();
    iframe.src = url;
}
