      '<button class="btn primary" onclick="forceIframe(\''+esc(pageUrl)+'\',\''+esc(name)+'\')">📺 Prova iframe ändå</button>'+
      '<button class="btn purple" onclick="approveTop(\''+esc(pageUrl)+'\')">✅ Öppna helskärm Cloudflare</button>'+
    '</div>'+
  '</div>';

  // Lista av kända direkta mönster för karwan.tv - vi testar dessa direkt
  var slug = pageUrl.replace('https://karwan.tv/','').replace('/','').split('/')[0].split('?')[0];
  var knownPatterns = [
    'https://cdn.karwan.tv/'+slug+'/index.m3u8',
    'https://cdn.karwan.tv/'+slug+'-tv/index.m3u8',
    'https://live.karwan.tv/'+slug+'/index.m3u8',
    'https://karwan.tv/live/'+slug+'/index.m3u8',
  ];

  // Försök proxy-extraktion
  var proxies = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?',
    'https://api.codetabs.com/v1/proxy?quest='
  ];

  var statusEl = document.getElementById('extractStatus');
  var logEl = document.getElementById('extractLog');

  // Steg 1: testa kända direkta länkar direkt (snabbast för LG)
  testKnownLinks(knownPatterns, 0, name, statusEl, logEl, function(found){
    if(found) return;
    // Steg 2: försök extrahera via proxy
    tryProxyExtraction(pageUrl, proxies, 0, statusEl, logEl, name);
  });
}

function testKnownLinks(list, idx, name, statusEl, logEl, cb){
  if(idx >= list.length){ cb(false); return; }
  var testUrl = list[idx];
  logEl.textContent = 'Testar direkt: '+testUrl;
  // HEAD request för att kolla om den finns
  fetch(testUrl, {method:'HEAD', mode:'no-cors'}).then(function(){
    // no-cors ger opaque response, vi kan inte veta - försök spela ändå om det är karwan cdn
    // För LG TV - testa att spela direkt
    logEl.textContent = 'Provar spela: '+testUrl;
    tryPlayDirect(testUrl, name, function(success){
      if(success){
        statusEl.textContent = '✅ Direkt länk hittad!';
        cb(true);
      }else{
        testKnownLinks(list, idx+1, name, statusEl, logEl, cb);
      }
    });
  }).catch(function(){
    testKnownLinks(list, idx+1, name, statusEl, logEl, cb);
  });
}

function tryPlayDirect(hlsUrl, name, callback){
  var wrap=document.getElementById('vwrap');
  // Skapa temporär video för test
  var testId = 'test_'+Date.now();
  var tempHtml = '<video id="'+testId+'" style="display:none"></video>';
  var div = document.createElement('div');
  div.innerHTML = tempHtml;
  document.body.appendChild(div);
  var vid = document.getElementById(testId);
  var success = false;
  var timeout = setTimeout(function(){
    if(!success){
      document.body.removeChild(div);
      if(hlsInst){hlsInst.destroy();hlsInst=null;}
      callback(false);
    }
  }, 4000);

  if(Hls.isSupported()){
    var tempHls = new Hls({enableWorker:false});
    tempHls.loadSource(hlsUrl);
    tempHls.attachMedia(vid);
    tempHls.on(Hls.Events.MANIFEST_PARSED, function(){
      success = true;
      clearTimeout(timeout);
      document.body.removeChild(div);
      tempHls.destroy();
      // Spela på riktigt
      playDirectHLS(hlsUrl, name);
      callback(true);
    });
    tempHls.on(Hls.Events.ERROR, function(){
      clearTimeout(timeout);
      document.body.removeChild(div);
      tempHls.destroy();
      callback(false);
    });
  }else{
    vid.src = hlsUrl;
    vid.addEventListener('loadedmetadata', function(){
      success = true;
      clearTimeout(timeout);
      document.body.removeChild(div);
      playDirectHLS(hlsUrl, name);
      callback(true);
    });
    vid.addEventListener('error', function(){
      clearTimeout(timeout);
      document.body.removeChild(div);
      callback(false);
    });
  }
}

function playDirectHLS(hlsUrl, name){
  var wrap=document.getElementById('vwrap');
  wrap.innerHTML = '<video id="vplayer" controls autoplay style="width:100%;height:100%"></video><div style="position:absolute;top:8px;left:8px;background:#0f2a1e;border:1px solid #4ecca3;color:#4ecca3;font-size:0.65rem;padding:3px 8px;border-radius:12px">Direkt HLS - Ingen Cloudflare</div>';
  var vid=document.getElementById('vplayer');
  if(Hls.isSupported()){
    hlsInst=new Hls({enableWorker:false});
    hlsInst.loadSource(hlsUrl);
    hlsInst.attachMedia(vid);
    hlsInst.on(Hls.Events.MANIFEST_PARSED,function(){vid.play().catch(function(){});});
  }else{
    vid.src=hlsUrl;vid.play().catch(function(){});
  }
}

function tryProxyExtraction(pageUrl, proxies, idx, statusEl, logEl, name){
  if(idx >= proxies.length){
    statusEl.textContent = '⚠️ Kunde inte extrahera direkt - visar fallback';
    logEl.textContent = 'Alla proxies misslyckades. Prova iframe eller helskärm.';
    return;
  }
  var proxyUrl = proxies[idx] + encodeURIComponent(pageUrl);
  logEl.textContent = 'Proxy '+ (idx+1) +': '+proxies[idx].split('?')[0];
  statusEl.textContent = '🔍 Försöker proxy '+(idx+1)+'...';

  fetch(proxyUrl)
    .then(function(r){ return r.text(); })
    .then(function(html){
      // Leta efter m3u8 länkar i HTML
      var m3u8Regex = /https?:\/\/[^"'\s]+\.m3u8[^"'\s]*/gi;
      var matches = html.match(m3u8Regex);
      if(matches && matches.length>0){
        // Filtrera bort annonser och ta första som verkar vara karwan
        var best = matches.find(function(u){ return u.indexOf('karwan')>-1 || u.indexOf('cdn')>-1; }) || matches[0];
        best = best.replace(/\\/g,'');
        statusEl.textContent = '✅ Hittade länk via proxy!';
        logEl.textContent = best;
        playDirectHLS(best, name);
      }else{
        // Leta efter iframe src som kan vara HLS
        var iframeRegex = /<iframe[^>]+src=["']([^"']+)["']/gi;
        var m;
        var iframes=[];
        while((m=iframeRegex.exec(html))!==null){ iframes.push(m[1]); }
        if(iframes.length>0){
          logEl.textContent = 'Hittade iframe: '+iframes[0].substring(0,80);
          // Försök spela iframe src som HLS om det är m3u8 annars visa iframe
          if(iframes[0].indexOf('.m3u8')>-1){
            playDirectHLS(iframes[0], name);
          }else{
            // Rekursiv extraktion på iframe src
            tryProxyExtraction(iframes[0], proxies, 0, statusEl, logEl, name);
          }
        }else{
          tryProxyExtraction(pageUrl, proxies, idx+1, statusEl, logEl, name);
        }
      }
    })
    .catch(function(err){
      logEl.textContent = 'Proxy fel: '+err.message;
      tryProxyExtraction(pageUrl, proxies, idx+1, statusEl, logEl, name);
    });
}

function forceIframe(url,name){
  var wrap=document.getElementById('vwrap');
  var bust = Date.now();
  wrap.innerHTML='<div style="width:100%;height:100%;display:flex;flex-direction:column"><div style="padding:8px;background:#0f212e;display:flex;justify-content:space-between"><span style="color:#4ecca3;font-size:0.8rem">'+esc(name)+' - iframe läge</span><button class="btn purple" onclick="approveTop(\''+esc(url)+'\')">✅ Godkänn Cloudflare helskärm</button></div><iframe src="'+esc(url)+'?_='+bust+'" style="flex:1;width:100%;border:none;background:#fff" allowfullscreen sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-presentation"></iframe></div>';
}
function approveTop(url){
  localStorage.setItem('karwan_pending', url);
  if(confirm('Öppnar '+url+' i helskärm för Cloudflare-godkännande.\n\n1. Godkänn Jag är människa\n2. Tryck BACK på fjärrkontrollen för att komma tillbaka\n\nFortsätt?')){
    window.location.href = url;
  }
}

render('all');
</script>
