<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>KURDISH · KARWAN · iFILM</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #fff; min-height: 100vh; }
    .header { background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); padding: 18px 20px; text-align: center; border-bottom: 1px solid rgba(78,204,163,0.3); }
    .header h1 { font-size: 2.3em; color: #4ecca3; letter-spacing: -0.5px; margin-bottom: 6px; }
    .nav-buttons { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; background: rgba(0,0,0,0.25); }
    .nav-btn { background: #1e2f3f; color: #e0e0e0; border: none; padding: 8px 16px; border-radius: 40px; cursor: pointer; font-weight: 600; }
    .nav-btn:hover, .nav-btn.active { background: #4ecca3; color: #0a1c2a; }
    .container { display: flex; height: calc(100vh - 180px); padding: 16px; gap: 16px; }
    .channel-list { width: 300px; background: rgba(0,0,0,0.45); border-radius: 22px; padding: 12px; overflow-y: auto; }
    .video-container { flex: 1; background: #03090e; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; }
    .video-wrapper { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; }
    .channel-item { padding: 10px; margin: 6px 0; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,0.1); }
    .channel-item:hover { background: rgba(78,204,163,0.3); }
    .category-title { color: #4ecca3; font-weight: bold; padding: 10px 6px 5px; border-bottom: 2px solid #4ecca3; margin: 15px 0 8px; }
    .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; }
    .popup-overlay.show { display: flex; }
    .popup-browser { width: 90vw; height: 85vh; background: #08161f; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  </style>
</head>
<body>

<div class="header">
  <h1>KURDISH · KARWAN · iFILM ✨</h1>
  <p>Klicka på en kanal • Karwan öppnas i popup</p>
</div>

<div class="nav-buttons">
  <button class="nav-btn active" onclick="showAll(this)">Alla</button>
  <button class="nav-btn" onclick="filterDirect(this,'akhbar')">📰 Akhbar</button>
  <button class="nav-btn" onclick="filterDirect(this,'musik')">🎵 Musik</button>
  <button class="nav-btn" onclick="filterDirect(this,'minal')">🧒 Minal</button>
  <button class="nav-btn" onclick="filterDirect(this,'film')">🎬 Film</button>
  <button class="nav-btn" onclick="filterDirect(this,'dini')">🕌 Dini</button>
  <button class="nav-btn" onclick="filterDirect(this,'sport')">⚽ Sport</button>
  <button class="nav-btn" onclick="filterDirect(this,'karwan')">⭐ Karwan TV</button>
  <button class="nav-btn" onclick="filterDirect(this,'ifilm')">🌍 iFilm</button>
</div>

<div class="container">
  <aside class="channel-list" id="channel-list">
    <div id="ch-container"></div>
  </aside>
  <main class="video-container">
    <div class="video-wrapper" id="vwrap">
      <div class="error-msg" style="text-align:center; color:#aaa;">
        <h3>Välj en kanal till vänster</h3>
      </div>
    </div>
  </main>
</div>

<!-- Popup -->
<div class="popup-overlay" id="popup-overlay" onclick="handleOverlayClick(event)">
  <div class="popup-browser" id="popup-browser">
    <div style="background:#0c1e2c; padding:12px; text-align:center; font-weight:bold;" id="popup-title">Karwan Browser</div>
    <div id="popup-iframe-wrap" style="flex:1; position:relative;">
      <div id="popup-loading" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#030c13;">Laddar kanal...</div>
      <iframe id="popup-iframe" style="width:100%; height:100%; border:none; display:none;" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script>
// ==================== KANALDATA ====================
const channels = {
  akhbar: [
    { name:'Zagros', url:'https://5a3ed7a72ed4b.streamlock.net/zagrostv/SMIL:myStream.smil/playlist.m3u8' },
    { name:'Rudaw', url:'https://live.rudaw.net/hls/rudaw-tv/stream_1080p.m3u8' },
    { name:'Kurdistan24', url:'https://d1x82nydcxndze.cloudfront.net/live/index_720p25.m3u8' },
    { name:'NRT News', url:'https://live20.bozztv.com/giatv/giatv-nrt/nrt/chunks.m3u8' },
    { name:'KurdSat News', url:'https://hlspackager.akamaized.net/live/DB/KURDSAT_NEWS/HLS/KURDSAT_NEWS.m3u8' }
  ],
  musik: [
    { name:'KurdMax Music', url:'https://6476e46b58f91.streamlock.net/music/MUSIC2402/chunklist_w1890238732.m3u8' },
    { name:'4 Kurd', url:'https://4kuhls.persiana.live/hls/stream.m3u8' }
  ],
  minal: [
    { name:'Kidco', url:'http://avrstream.com:1935/live/kidcohd/tracks-v1a1/mono.m3u8' },
    { name:'Zarok Kurmanci', url:'https://zindikurmanci.zaroktv.com.tr/hls/0/stream.m3u8' }
  ],
  film: [
    { name:'Kurdsat HD', url:'https://hlspackager.akamaized.net/live/DB/KURDSAT_HD/HLS/KURDSAT_HD.m3u8' },
    { name:'KurdMax Sorani', url:'https://6476e46b58f91.streamlock.net/liveTrans/KURDB3388/chunklist_w1251224212.m3u8' }
  ],
  dini: [
    { name:'MMN Quran', url:'http://mmn.mypsx.net:1935/live/mmnhdquran/playlist.m3u8' }
  ],
  sport: [
    { name:'MMN Sport', url:'http://mmn.mypsx.net:1935/live/mmnhdsport/playlist.m3u8' }
  ],
  karwan: [
    { name:'Cihan TV', url:'https://karwan.tv/cihan-tv', method:'popup' },
    { name:'Zaxo TV', url:'https://karwan.tv/zaxo-tv', method:'popup' },
    { name:'Speda Drama', url:'https://karwan.tv/speda-drama', method:'popup' },
    { name:'Kurdmax TV', url:'https://karwan.tv/kurdmax-tv', method:'popup' },
    { name:'Astera Movies', url:'https://karwan.tv/astera-movies', method:'popup' }
  ],
  ifilm: [
    { name:'iFilm Farsi', url:'https://live.presstv.ir/hls/ifilmfa.m3u8' }
  ]
};

// ==================== POPUP FIX ====================
let popUrl = '';

function openPopup(url, name) {
  popUrl = url;
  document.getElementById('popup-title').textContent = name;
  document.getElementById('popup-overlay').classList.add('show');
  document.getElementById('popup-loading').style.display = 'flex';
  const iframe = document.getElementById('popup-iframe');
  iframe.style.display = 'none';
  iframe.src = url;

  iframe.onload = () => {
    document.getElementById('popup-loading').style.display = 'none';
    iframe.style.display = 'block';
  };
}

function handleOverlayClick(e) {
  if (e.target.id === 'popup-overlay') document.getElementById('popup-overlay').classList.remove('show');
}

function closePopup() {
  document.getElementById('popup-overlay').classList.remove('show');
}

// ==================== RENDER ====================
function render() {
  let html = '';
  Object.keys(channels).forEach(cat => {
    html += `<div class="category-title">${cat.toUpperCase()}</div>`;
    channels[cat].forEach(ch => {
      const isPopup = ch.method === 'popup' ? ' <span style="font-size:10px;">🪟</span>' : '';
      html += `
        <div class="channel-item" onclick="play('${ch.url}', '${ch.name}', '${ch.method || "hls"}')">
          ${ch.name}${isPopup}
        </div>`;
    });
  });
  document.getElementById('ch-container').innerHTML = html;
}

function play(url, name, method) {
  if (method === 'popup') {
    openPopup(url, name);
  } else {
    alert('HLS-spelare skulle startas här\nURL: ' + url);
    // Lägg till din vanliga HLS-kod här om du vill
  }
}

function showAll() { render(); }
function filterDirect(btn, cat) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  let html = `<div class="category-title">${cat.toUpperCase()}</div>`;
  channels[cat].forEach(ch => {
    html += `<div class="channel-item" onclick="play('${ch.url}', '${ch.name}', '${ch.method || "hls"}')">${ch.name}</div>`;
  });
  document.getElementById('ch-container').innerHTML = html;
}

// Start
render();
</script>
</body>
</html>
